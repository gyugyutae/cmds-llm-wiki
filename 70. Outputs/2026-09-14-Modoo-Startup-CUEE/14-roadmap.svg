<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#101318"/>
  <text x="90" y="105" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="48" font-weight="700" fill="#ffffff">검증에서 제휴까지, 6개월 실행 로드맵</text>
  <text x="90" y="160" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" fill="#9ca3af">모든 수치는 완료 실적이 아니라 달성할 목표입니다</text>
  <line x1="150" y1="485" x2="1450" y2="485" stroke="#1677e8" stroke-width="8"/>
  <g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">
    <circle cx="190" cy="485" r="20" fill="#1677e8"/><text x="190" y="280" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">2026.09</text><text x="190" y="335" text-anchor="middle" font-size="22" fill="#d1d5db">Play 검토</text><text x="190" y="372" text-anchor="middle" font-size="22" fill="#d1d5db">테스터 12명 모집</text><text x="190" y="575" text-anchor="middle" font-size="20" fill="#60a5fa">14일 기술 테스트</text>
    <circle cx="500" cy="485" r="20" fill="#1677e8"/><text x="500" y="280" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">2026.10</text><text x="500" y="335" text-anchor="middle" font-size="22" fill="#d1d5db">전국 노선 입력 베타</text><text x="500" y="372" text-anchor="middle" font-size="22" fill="#d1d5db">65세 이상 5명 검증</text><text x="500" y="575" text-anchor="middle" font-size="20" fill="#60a5fa">4명 이상 성공 목표</text>
    <circle cx="810" cy="485" r="20" fill="#1677e8"/><text x="810" y="280" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">2026.11</text><text x="810" y="335" text-anchor="middle" font-size="22" fill="#d1d5db">Play 공개 출시 목표</text><text x="810" y="372" text-anchor="middle" font-size="22" fill="#d1d5db">코레일 무료 실증 제안</text><text x="810" y="575" text-anchor="middle" font-size="20" fill="#60a5fa">결과·시연 영상 첨부</text>
    <circle cx="1120" cy="485" r="20" fill="#1677e8"/><text x="1120" y="280" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">2026.12</text><text x="1120" y="335" text-anchor="middle" font-size="22" fill="#d1d5db">쿠팡 구매 안내</text><text x="1120" y="372" text-anchor="middle" font-size="22" fill="#d1d5db">시제품 완성</text><text x="1120" y="575" text-anchor="middle" font-size="20" fill="#60a5fa">거래 귀속 방식 검토</text>
    <circle cx="1410" cy="485" r="20" fill="#1677e8"/><text x="1410" y="280" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">2027.03</text><text x="1410" y="335" text-anchor="middle" font-size="22" fill="#d1d5db">누적 설치 100건</text><text x="1410" y="372" text-anchor="middle" font-size="22" fill="#d1d5db">고령 사용자 20명</text><text x="1410" y="575" text-anchor="middle" font-size="20" fill="#60a5fa">실증 후속 협의</text>
