  <rect x="90" y="700" width="1420" height="100" rx="24" fill="#172033" stroke="#1677e8" stroke-width="3"/>
  <text x="800" y="762" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#ffffff">대표 주 10시간 · 디자이너 2명 각 주 10시간 · 팀 전체 주 1회 점검</text>
